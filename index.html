<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Coin Toss 🐱</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet"><style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:radial-gradient(circle at top,#ffb6d9,#ff69b4,#1a0014);
overflow:hidden;
color:white;
text-align:center;
}

.stars span{
position:absolute;
color:white;
animation:twinkle 2s infinite alternate;
opacity:0.7;
}

@keyframes twinkle{
from{opacity:0.2;}
to{opacity:1;}
}

h1{
font-size:4rem;
margin-bottom:20px;
text-shadow:0 0 20px rgba(255,255,255,0.5);
}

p{
font-size:1.2rem;
opacity:0.85;
margin-bottom:40px;
}

.coin{
width:220px;
height:220px;
border-radius:50%;
background:linear-gradient(145deg,#ffe066,#ffb703);
display:flex;
justify-content:center;
align-items:center;
font-size:5rem;
box-shadow:0 0 40px rgba(255,215,0,0.5);
transition:transform 2s ease;
position:relative;
}

.coin.flip{
animation:flip 2s ease-in-out;
}

@keyframes flip{
0%{transform:rotateY(0deg) rotateX(0deg);}
100%{transform:rotateY(1440deg) rotateX(1440deg);}
}

button{
margin-top:40px;
padding:18px 40px;
border:none;
border-radius:50px;
background:#ff4fa3;
color:white;
font-size:1.2rem;
font-weight:700;
cursor:pointer;
transition:0.3s;
box-shadow:0 0 25px rgba(255,79,163,0.4);
}

button:hover{
transform:scale(1.08);
}

.result{
margin-top:35px;
font-size:2rem;
font-weight:700;
min-height:60px;
}

.cat-img{
display:none;
margin-top:25px;
max-width:320px;
border-radius:25px;
box-shadow:0 0 40px rgba(255,255,255,0.2);
animation:pop 0.8s ease;
}

@keyframes pop{
0%{transform:scale(0.5);opacity:0;}
100%{transform:scale(1);opacity:1;}
}

.link-btn{
display:none;
margin-top:25px;
padding:15px 30px;
background:#00c896;
text-decoration:none;
color:white;
border-radius:40px;
font-weight:700;
box-shadow:0 0 25px rgba(0,200,150,0.4);
transition:0.3s;
}

.link-btn:hover{
transform:scale(1.05);
}

.confetti{
position:fixed;
top:-10px;
font-size:20px;
animation:fall linear infinite;
pointer-events:none;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
}
}
</style></head>
<body><div class="stars" id="stars"></div><h1>🐱 Cat Coin Toss 🪙</h1>
<p>Flip the magical cat coin and let destiny decide ✨</p><div class="coin" id="coin">🪙</div><button onclick="flipCoin()">Toss Coin</button>

<div class="result" id="result"></div><a href="https://novaknightx.github.io/Bhai-ka-birthday/" target="_blank" class="link-btn" id="headsBtn">
🎉 Heads Won — Enter Secret Page
</a><img id="catImg" class="cat-img" src="https://media.tenor.com/fDq7G0zT4tAAAAAC/cat-laughing.gif" alt="Funny Cat Laughing"

> 

<script>
for(let i=0;i<80;i++){
const star=document.createElement('span');
star.innerHTML='✦';
star.style.left=Math.random()*100+'vw';
star.style.top=Math.random()*100+'vh';
star.style.fontSize=Math.random()*12+'px';
document.getElementById('stars').appendChild(star);
}

for(let i=0;i<60;i++){
const conf=document.createElement('div');
conf.classList.add('confetti');
conf.innerHTML=['✨','🐾','💖'][Math.floor(Math.random()*3)];
conf.style.left=Math.random()*100+'vw';
conf.style.animationDuration=(Math.random()*6+4)+'s';
document.body.appendChild(conf);
}

function flipCoin(){
const coin=document.getElementById('coin');
const result=document.getElementById('result');
const catImg=document.getElementById('catImg');
const headsBtn=document.getElementById('headsBtn');

catImg.style.display='none';
headsBtn.style.display='none';
result.innerHTML='';

coin.classList.add('flip');

setTimeout(()=>{
coin.classList.remove('flip');

const outcome=Math.random()<0.5 ? 'heads' : 'tails';

if(outcome==='heads'){
coin.innerHTML='😺';
result.innerHTML='🎉 HEADS! Lucky Cat Energy Activated';
headsBtn.style.display='inline-block';
}
else{
coin.innerHTML='🙀';
result.innerHTML='😂 TAILS! The cats are laughing at you';
catImg.style.display='block';
}

},2000);
}
</script></body>
</html>
