<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
/>

<title>Cat Coin Toss 🐱</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap"
rel="stylesheet"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
width:100%;
overflow-x:hidden;
}

body{
min-height:100svh;
width:100%;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

background:
radial-gradient(
circle at top,
#ffb6d9,
#ff69b4,
#1a0014
);

overflow-x:hidden;
overflow-y:auto;

color:white;
text-align:center;
padding:
clamp(30px,6vw,60px)
20px;

position:relative;
}

/* STARS */

.stars{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:0;
}

.stars span{
position:absolute;
color:white;
animation:twinkle 2s infinite alternate;
opacity:0.7;
}

@keyframes twinkle{
from{
opacity:0.2;
}
to{
opacity:1;
}
}

/* CONTENT */

.container{
position:relative;
z-index:2;

width:min(100%,700px);

display:flex;
flex-direction:column;
align-items:center;
}

/* TITLE */

h1{
font-size:clamp(2.5rem,8vw,4.5rem);
margin-bottom:20px;

text-shadow:
0 0 20px rgba(255,255,255,0.5);

line-height:1.1;
padding:0 10px;
}

p{
font-size:clamp(1rem,2.5vw,1.2rem);
opacity:0.85;
margin-bottom:40px;
line-height:1.6;
padding:0 10px;
}

/* COIN */

.coin{
width:clamp(140px,40vw,220px);
height:clamp(140px,40vw,220px);

border-radius:50%;

background:
linear-gradient(
145deg,
#ffe066,
#ffb703
);

display:flex;
justify-content:center;
align-items:center;

font-size:clamp(3rem,10vw,5rem);

box-shadow:
0 0 40px rgba(255,215,0,0.5);

transition:transform 2s ease;

position:relative;

user-select:none;
}

.coin.flip{
animation:flip 2s ease-in-out;
}

@keyframes flip{
0%{
transform:rotateY(0deg) rotateX(0deg);
}
100%{
transform:rotateY(1440deg) rotateX(1440deg);
}
}

/* BUTTON */

button{
margin-top:40px;

padding:
16px 34px;

border:none;
border-radius:50px;

background:#ff4fa3;

color:white;

font-size:clamp(1rem,2vw,1.2rem);
font-weight:700;

cursor:pointer;

transition:0.3s;

box-shadow:
0 0 25px rgba(255,79,163,0.4);

max-width:100%;
}

button:hover{
transform:scale(1.08);
}

/* RESULT */

.result{
margin-top:35px;

font-size:clamp(1.4rem,4vw,2rem);

font-weight:700;

min-height:60px;

line-height:1.4;
padding:0 10px;
}

/* CAT GIF */

.cat-img{
display:none;

margin-top:25px;

width:min(90%,320px);

border-radius:25px;

box-shadow:
0 0 40px rgba(255,255,255,0.2);

animation:pop 0.8s ease;
}

@keyframes pop{
0%{
transform:scale(0.5);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}

/* SECRET BUTTON */

.link-btn{
display:none;

margin-top:25px;

padding:
15px 30px;

background:#00c896;

text-decoration:none;
color:white;

border-radius:40px;

font-weight:700;

box-shadow:
0 0 25px rgba(0,200,150,0.4);

transition:0.3s;

max-width:90%;
}

.link-btn:hover{
transform:scale(1.05);
}

/* CONFETTI */

.confetti{
position:fixed;
top:-10px;
font-size:20px;
animation:fall linear infinite;
pointer-events:none;
z-index:1;
}

@keyframes fall{
to{
transform:
translateY(110vh)
rotate(360deg);
}
}

/* MOBILE */

@media (max-width:768px){

button{
width:100%;
max-width:280px;
}

.link-btn{
width:100%;
max-width:320px;
}

}

/* SMALL HEIGHT */

@media (max-height:700px){

body{
padding-top:80px;
padding-bottom:80px;
}

}

</style>

</head>

<body>

<div class="stars" id="stars"></div>

<div class="container">

<h1>
🐱 Cat Coin Toss 🪙
</h1>

<p>
Flip the magical cat coin and let destiny decide ✨
</p>

<div class="coin" id="coin">
🪙
</div>

<button onclick="flipCoin()">
Toss Coin
</button>

<div class="result" id="result"></div>

<a
href="https://novaknightx.github.io/Bhai-ka-birthday/"
target="_blank"
class="link-btn"
id="headsBtn"
>
🎉 Heads Won — Enter Secret Page
</a>

<img
id="catImg"
class="cat-img"
src="https://media.tenor.com/fDq7G0zT4tAAAAAC/cat-laughing.gif"
alt="Funny Cat Laughing"
/>

</div>

<script>

/* STARS */

for(let i=0;i<80;i++){

const star=document.createElement('span');

star.innerHTML='✦';

star.style.left=Math.random()*100+'vw';

star.style.top=Math.random()*100+'vh';

star.style.fontSize=Math.random()*12+'px';

document.getElementById('stars').appendChild(star);

}

/* CONFETTI */

for(let i=0;i<60;i++){

const conf=document.createElement('div');

conf.classList.add('confetti');

conf.innerHTML=
['✨','🐾','💖']
[Math.floor(Math.random()*3)];

conf.style.left=Math.random()*100+'vw';

conf.style.animationDuration=
(Math.random()*6+4)+'s';

document.body.appendChild(conf);

}

/* FLIP */

function flipCoin(){

const coin=document.getElementById('coin');

const result=document.getElementById('result');

const catImg=document.getElementById('catImg');

const headsBtn=document.getElementById('headsBtn');

catImg.style.display='none';

headsBtn.style.display='none';

result.innerHTML='';

coin.classList.add('flip');

setTimeout(()=>{

coin.classList.remove('flip');

const outcome=
Math.random()<0.5
? 'heads'
: 'tails';

if(outcome==='heads'){

coin.innerHTML='😺';

result.innerHTML=
'🎉 HEADS! Lucky Cat Energy Activated';

headsBtn.style.display='inline-block';

}

else{

coin.innerHTML='🙀';

result.innerHTML=
'😂 TAILS! The cats are laughing at you';

catImg.style.display='block';

}

},2000);

}

</script>

</body>

</html>
